    <script>
      // Suppress Vite dev server HMR WebSocket disconnect noise in preview sandbox environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          const reasonStr = typeof event.reason === 'string' 
            ? event.reason 
            : (event.reason.message || String(event.reason));
          if (
            reasonStr.includes('WebSocket closed without opened') ||
            reasonStr.includes('failed to connect to websocket') ||
            reasonStr.includes('[vite]')
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }
      });
      window.addEventListener('error', function(event) {
        if (event && event.message) {
          if (
            event.message.includes('WebSocket closed without opened') ||
            event.message.includes('failed to connect to websocket')
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }
      }, true);
